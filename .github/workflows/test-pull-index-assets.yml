name: Test agency index downloader

on:
  pull_request:
    paths:
      - "scripts/pull_index_assets.py"
      - "tests/**"
      - ".github/workflows/test-pull-index-assets.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run downloader tests
        run: python -m unittest discover -s tests -v
